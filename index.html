<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evanjelin ❤️ Be My Valentine</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="container">

  <h1 class="title">Hey Evanjelin ❤️</h1>
  <p class="subtitle">This is from my heart… only for you</p>

  <div class="gallery">
    <img src="images/photo1.jpg" class="photo"/>
    <img src="images/photo2.jpg" class="photo"/>
    <img src="images/photo3.jpg" class="photo"/>
    <img src="images/photo4.jpg" class="photo"/>
  </div>

  <div class="message">
    <p>❤️ I love you 26 times</p>
    <p>🌍 This life is dedicated to you</p>
    <p>✨ I am proud of you</p>
    <p>🙏 I am grateful for you</p>
    <p>🧩 You complete me</p>
    <p>♾️ Love you forever</p>
  </div>

  <h2 class="question">Evanjelin, will you be my Valentine? 💖</h2>

  <div class="buttons">
    <button id="yesBtn">YES 💕</button>
    <button id="noBtn">NO 🙈</button>
  </div>

  <div id="finalMessage" class="hidden">
    <h2>YAYYYY 🥹❤️</h2>
    <p>You just made my world brighter.</p>
    <p>Forever yours 💍</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
